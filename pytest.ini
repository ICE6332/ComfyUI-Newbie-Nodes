[pytest]
# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# 输出选项
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=comfy_newbie_gemma_chat
    --cov-report=html
    --cov-report=term-missing
    --color=yes

# 标记定义
markers =
    slow: 慢速测试
    integration: 集成测试
    unit: 单元测试 (默认)
